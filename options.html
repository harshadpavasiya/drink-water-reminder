<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drink Water Reminder Settings</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="options.css" />
  </head>

  <body>
    <div class="container">
      <img src="icon.png" alt="Drink Water Icon" class="logo" />
      <h1>Settings</h1>
      <div class="form-group">
        <label for="interval">Reminder Interval (minutes)</label>
        <input type="number" id="interval" min="1" value="60" />
      </div>
      <button id="save">Save Settings</button>
      <p id="nextAlarmInfo"></p>
    </div>

    <script src="options.js"></script>
  </body>
</html>
