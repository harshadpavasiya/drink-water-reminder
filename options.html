<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drink Water Reminder Settings</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="options.css" />
  </head>

  <body>
    <div class="container">
      <img src="icon-128.png" alt="Drink Water Icon" class="logo" />
      <h1>Settings</h1>
      <div class="form-group">
        <label for="interval">Reminder Interval (minutes)</label>
        <input type="number" id="interval" min="1" max="120" step="1" value="60" />
      </div>
      <div class="form-group">
        <label class="toggle">
          <input type="checkbox" id="soundEnabled" checked />
          <span>Play a chime with each reminder</span>
        </label>
      </div>
      <div class="form-group" id="volumeGroup">
        <label for="volume">Chime volume: <span id="volumeValue">25%</span></label>
        <input type="range" id="volume" min="0" max="100" step="5" value="25" />
        <button id="test" class="secondary" type="button">Test sound</button>
      </div>
      <button id="save">Save Settings</button>
      <p id="nextAlarmInfo"></p>
    </div>

    <script src="options.js"></script>
  </body>
</html>
